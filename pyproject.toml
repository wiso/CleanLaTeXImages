[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "clean-latex-images"
version = "0.1.0"
description = "Remove unused images from a LaTeX project"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.6"

[project.scripts]
clean-latex-images = "clean:main"

[tool.setuptools]
py-modules = ["clean"]
